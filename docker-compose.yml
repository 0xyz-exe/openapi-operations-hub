services:
  openapi-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openapi-operations-hub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/openapi_hub.sqlite
      - JWT_SECRET=production-secret-min-32-chars-replace-in-env
      - ADMIN_EMAIL=admin@apihub.local
      - ADMIN_PASSWORD=AdminSecurePassword123!
      - SSRF_PROTECTION_ENABLED=true
    volumes:
      - hub_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hub_data:
    driver: local
